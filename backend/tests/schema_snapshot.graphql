  reviewReturnClaim(input: ReviewReturnRequestInput!): ReturnClaimType!
  markNotificationAsRead(notificationId: UUID!): Boolean!
  updateNotificationPreferences(input: UpdateNotificationPreferencesInput!): Boolean!
  retryFailedJob(jobId: UUID!): AutomationJobType!
  createAutomationJob(jobType: String!, payload: String = null): AutomationJobType!
  assignStaffWorkQueue(userId: UUID!, workQueue: String!): UserType!
  triggerUserPasswordReset(userId: UUID!): Boolean!
  sendRetailerPaymentReminder(shopkeeperId: UUID!): Boolean!
  applyBulkPriceUpdate(action: String!, value: Float!, reason: String!, category: String = null): BulkPriceSimulationResult!
