  createChallanReturn(input: CreateChallanReturnInput!): ChallanReturnType!
  createInvoiceReturn(input: CreateInvoiceReturnInput!): InvoiceReturnType!
  recordAdvancePayment(input: RecordAdvancePaymentInput!): AdvancePaymentType!
