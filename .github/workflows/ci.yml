name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend CI ─────────────────────────────────────────────
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          APP_ENV: "testing"
          DEBUG: "true"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-32-chars-long-minimum"
        run: |
          pytest backend/tests -v --durations=10

  # ── Frontend CI ────────────────────────────────────────────
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_GRAPHQL_URL: "/graphql"
        run: npm run build

  # ── Deployment (EC2) ───────────────────────────────────────
  deploy-ec2:
    name: Deploy to Production EC2
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check Deployment Secrets
        id: check-secrets
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::EC2_SSH_KEY secret not found in repository. Skipping automatic SSH deployment."
          fi

      - name: Deploy via SSH to AWS EC2
        if: steps.check-secrets.outputs.has_secret == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST || '13.223.50.113' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "Starting automated deployment on EC2..."
            cd /home/ubuntu/pharmacyfantasy
            git pull origin main
            sudo docker compose up -d --build
            echo "Waiting for health check..."
            sleep 8
            curl -f http://localhost/health || (echo "Health check failed!" && exit 1)
            echo "Deployment completed successfully!"
